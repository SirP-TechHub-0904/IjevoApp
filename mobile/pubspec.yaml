name: ijevo_mobile
description: "Ijevo Mobile - Ultra-Fast UK to Nigeria & Global Remittance"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.4
  google_fonts: ^6.2.1
  intl: ^0.19.0
  country_flags: ^3.1.0
  qr_flutter: ^4.1.0
  share_plus: ^9.0.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0
  url_launcher: ^6.3.3
  shared_preferences: ^2.3.2
  onesignal_flutter: 5.5.2
  flutter_local_notifications: ^21.0.0
  pdf: ^3.12.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  archive: ^4.7.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon_standard.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
